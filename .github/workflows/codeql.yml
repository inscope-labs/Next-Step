name: CodeQL

# Static security scanning for engine/'s Go code. No dependency on the
# Oracle Always Free VM runtime plane, or vice versa
# (docs/security-model.md §3) -- this is a build-time-only analysis.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod

      - uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build engine/
        working-directory: engine
        run: go build ./...

      - uses: github/codeql-action/analyze@v3
